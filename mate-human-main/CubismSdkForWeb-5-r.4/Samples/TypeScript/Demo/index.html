<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TypeScript HTML App</title>
  <style>
    html, body {
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
    }
    html {
      overscroll-behavior-x: none;
      touch-action: none;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    body > canvas:only-child {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* 切换按钮样式 */
    #desk-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      transition: background-color 0.3s;
    }
    #desk-toggle:hover {
      background-color: #0056b3;
    }
    #desk-toggle:active {
      transform: translateY(2px);
    }
    #desk-toggle.active {
      background-color: #28a745;
    }
    /* 加载状态提示 */
    #loading-indicator {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 18px;
      font-family: Arial, sans-serif;
      z-index: 999;
      pointer-events: none;
      transition: opacity 0.5s;
    }
  </style>
  <!-- Live2DCubismCore script -->
  <script src = "./Core/live2dcubismcore.js"></script>
  <!-- Build script -->
  <script src = "./src/main.ts" type="module"></script>
</head>
<body>
  <div id="loading-indicator">数字人加载中...</div>
  <button id="desk-toggle">酒吧模式</button>
</body>
</html>
